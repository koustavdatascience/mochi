<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mochi Popup Showcase</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #161616; background: #e9e9e6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 18% 10%, #fff 0 16%, transparent 42%), linear-gradient(135deg, #ecece9, #d9d9d5); }
    .stage { display: grid; grid-template-columns: 1fr 340px; gap: 72px; align-items: center; width: min(1120px, calc(100vw - 80px)); padding: 70px; border: 1px solid #fff; border-radius: 34px; background: rgb(255 255 255 / 58%); box-shadow: 0 24px 60px rgb(20 20 20 / 12%), inset 0 1px 0 #fff; }
    .copy { max-width: 500px; }
    .eyebrow { margin: 0 0 12px; color: #6f6f6a; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 64px; line-height: .96; letter-spacing: -.07em; }
    .copy p { margin: 22px 0 0; color: #666661; font-size: 19px; line-height: 1.55; }
    .logo { width: 116px; height: 116px; margin-bottom: 26px; border: 6px solid #111; border-radius: 34px; background: #fff; object-fit: cover; box-shadow: 0 8px 0 #c8c8c4; }
    .popup-window { width: 300px; padding: 0; overflow: hidden; border: 1px solid #c8c8c4; border-radius: 20px; background: #f1f1ef; box-shadow: 0 20px 42px rgb(0 0 0 / 20%); }
    .browser-bar { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; background: #dededb; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; }
    .popup-window iframe { display: block; width: 300px; height: 382px; border: 0; }
    .caption { margin-top: 16px; color: #74746f; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="stage">
    <section class="copy">
      <img class="logo" src="../assets/mochi-logo.png" alt="Mochi black cat logo">
      <p class="eyebrow">Mochi · browser companion</p>
      <h1>A little cat for every tab.</h1>
      <p>A tiny animated companion with twenty styles, cross-tab preferences, and a calm monochrome control panel.</p>
    </section>
    <section>
      <div class="popup-window">
        <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <iframe src="../popup.html" title="Mochi extension popup"></iframe>
      </div>
      <p class="caption">The Mochi popup · solid monochrome UI</p>
    </section>
  </main>
</body>
</html>

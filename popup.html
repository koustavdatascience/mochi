<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mochi</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="cat-mark" src="assets/mochi-logo.png" alt="Mochi logo">
        <div>
          <h1>Mochi</h1>
          <p>Quiet company for your tabs ·ᴗ·</p>
        </div>
      </header>

      <section class="skin-picker" aria-label="Choose a cat">
        <label for="cat-select">Cat style</label>
        <select id="cat-select">
          <option value="badBoy">Bad Boy</option>
          <option value="blackCat">Black Cat</option>
          <option value="bttvRolling">Rolling Cat</option>
          <option value="littleCream">Cream Cat</option>
          <option value="greenFrog">Frog Cat</option>
          <option value="tinyCute">Tiny Cat</option>
          <option value="scarfCat">Scarf Cat</option>
          <option value="blackCatRoll">Cat Roll</option>
          <option value="spinningBlue">Blue Spinner</option>
          <option value="yawningWhite">Yawning Cat</option>
          <option value="grayPixel">Pixel Cat</option>
          <option value="blushingCute">Blush Cat</option>
          <option value="danceBreak">Dancer</option>
          <option value="blueMeme">Meme Cat</option>
          <option value="heartLove">Love Cat</option>
          <option value="mewoOmori">Mewo</option>
          <option value="whiteSleeping">Sleepy Cat</option>
          <option value="whiteKitty">White Kitty</option>
          <option value="blehCat">Bleh Cat</option>
        </select>
      </section>

      <section class="controls" aria-label="Cat controls">
        <label class="control-row" for="visibility-toggle">
          <span>
            <strong>Show cat</strong>
            <small>Keep the cat visible across your tabs.</small>
          </span>
          <input id="visibility-toggle" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="control-row" for="pause-toggle">
          <span>
            <strong>Pause cat</strong>
            <small>Freeze movement and animation everywhere.</small>
          </span>
          <input id="pause-toggle" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <p id="status" class="status" role="status">Ready.</p>
      <p class="credit">Made by <a href="https://github.com/koustavdatascience" target="_blank" rel="noreferrer">Koustav Roy</a> ♡</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
